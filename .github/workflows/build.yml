name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Gerar projeto
        run: xcodegen generate
      - name: Compilar sem assinatura
        run: |
          xcodebuild -project Vigilia.xcodeproj -scheme Vigilia -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Empacotar IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Vigilia.app Payload/
          zip -r Vigilia.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Vigilia-ipa
          path: Vigilia.ipa
