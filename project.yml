name: Vigilia
options:
  bundleIdPrefix: com.vigilia
  deploymentTarget:
    iOS: "16.0"
targets:
  Vigilia:
    type: application
    platform: iOS
    sources: [Vigilia]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vigilia.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vigília
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
